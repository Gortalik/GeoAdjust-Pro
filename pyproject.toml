[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoadjust"
version = "1.0.0"
description = "Профессиональное уравнивание геодезических сетей (МНК)"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "GeoAdjust Team", email = "support@geoadjust.pro"}
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyqt5>=5.15",
    "pandas>=1.5",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "networkx>=3.0",
    "striprtf>=0.0.22"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4", 
    "pytest-cov", 
    "pytest-benchmark",
    "ruff>=0.3", 
    "mypy>=1.8", 
    "black",
    "memray", 
    "line-profiler",
    "pyinstaller>=6.0"
]

[project.scripts]
geoadjust = "geoadjust.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--tb=short",
    "--cov=src/geoadjust",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html"
]
markers = [
    "slow: длительные тесты",
    "gui: требует отрисовки",
    "math: математическое ядро"
]

[tool.coverage.run]
source = ["src/geoadjust"]
omit = ["*/__pycache__/*", "*/tests/*", "*/gui/debug_*"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
show_missing = true
fail_under = 75.0

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
